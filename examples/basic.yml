# 调用方工作流样例：对插件仓库做 DSH 生产环境启动测试
name: dsh-launch-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # artifact: 插件规格经 REST API 下载需要

jobs:
  test:
    runs-on: windows-latest # macos-latest / ubuntu-latest（ubuntu 需先起 Xvfb）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 示例：构建本仓库插件并上传为 artifact，再让 action 以 artifact: 引用
      - name: 构建插件
        run: |
          npm ci
          npm run build
          npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-build-artifact
          path: '*.tgz'

      - name: DSH 生产环境启动测试
        uses: <owner>/dsh-production-launch-test@v1
        with:
          dsh-version: 0.1.3-alpha.1
          lang: zh-CN
          simulated-llm: openai-completions openai-responses
          plugins: |
            artifact:plugin-build-artifact
            @dsh-plugin/dsh-loader
          user-script: |
            try { await click('继续'); } catch {}
            await click('设置');
            await screenshot('settings');
            await sendMessage('测试');
            await sleep(8000);
            await selectModel('sim-openai-responses/test-model');
            await screenshot('done');
