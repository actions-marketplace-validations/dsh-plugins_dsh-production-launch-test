# 全量兼容矩阵：7 个插件 × 全部 dsh 版本（≥0.1.0-rc.6，含 GitHub Releases 独占的源码版本）× 3 桌面系统
#
# 手动触发（workflow_dispatch）。每次触发都重新拉取：
#   - dsh 版本清单：npm @deepseek-ai/dsh 全部版本 ∪ GitHub Releases（dsh-v* tag），
#     npm 上缺失的版本由 build-source job 从源码构建（pnpm build + release:pack）；
#   - 7 个插件版本：npm dist-tags 的 latest 与 next 取较新者。
#
# 7 个插件安装进同一个测试 profile；任一环境插件加载失败 → 该 matrix 单元失败
# （fail-fast: false，其余单元继续）。
name: all-plugins-all-versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 动态解析版本矩阵与插件规格
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      source-matrix: ${{ steps.resolve.outputs.source-matrix }}
      has-source: ${{ steps.resolve.outputs.has-source }}
      plugins: ${{ steps.resolve.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-matrix.mjs

  # 源码独占版本（npm 无此版）每个构建一次，产物供所有 OS 复用
  build-source:
    needs: resolve
    if: needs.resolve.outputs.has-source == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.source-matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: 构建 dsh ${{ matrix.version }} 源码产物
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/build-source.mjs
          "github:deepseek-ai/deepseek-harness@dsh-v${{ matrix.version }}"
          dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-src-${{ matrix.version }}
          path: dist-npm/
          retention-days: 7

  # 3 OS × 全部 dsh 版本；7 插件装进同一 profile
  test:
    needs: [resolve, build-source]
    if: >-
      ${{
        always()
        && needs.resolve.result == 'success'
        && (needs.build-source.result == 'success' || needs.build-source.result == 'skipped')
      }}
    name: ${{ matrix.os }} / dsh ${{ matrix.dsh.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ubuntu runner 默认无显示服务，先起 Xvfb 提供桌面环境
      - name: 启动 Xvfb 显示服务
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          nohup sudo Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: DSH 生产环境启动测试（7 插件全量安装）
        uses: ./
        with:
          dsh-version: ${{ matrix.dsh.version }}
          dsh-source: ${{ matrix.dsh.source }}
          lang: zh-CN
          simulated-llm: all
          plugins: ${{ needs.resolve.outputs.plugins }}
          user-script: |
            try { await click('继续'); } catch {}
            await screenshot('home');
            await click('设置');
            await screenshot('settings');
